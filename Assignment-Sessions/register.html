<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
</head>
<body>
    <main>
        <h1>Register</h1>
        <form action="/register" method="POST">
            <p>
                <label for="username">Username</label><br>
                <input type="text" name="username" id="username" autocomplete="username" maxlength="50" required>
            </p>
            <p>
                <label for="email">E-mail</label><br>
                <input type="email" name="email" id="email" autocomplete="email" maxlength="254" required>
            </p>
            <p>
                <label for="password">Password</label><br>
                <input type="password" name="password" id="password" autocomplete="new-password" maxlength="1024" required>
            </p>
            <button type="submit">Register</button>
        </form>
        <p>Already registered? <a href="/login.html">Go to login</a></p>
    </main>
</body>
</html>
